<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Un-Journal</title>
  <meta name="description" content="Write what's on your mind. Let it go. The Un-Journal for iPhone.">
  <!-- Apple Smart App Banner: shows "Get" if the app isn't installed and "Open" if it is. -->
  <meta name="apple-itunes-app" content="app-id=6785877239">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap">
  <style>
    :root {
      --bg: #FAF8F5;
      --card: #FFFFFF;
      --ink: #242522;
      --muted: #6B655F;
      --sage: #496646;
      --border: #E6E0D9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    .app-icon {
      display: block;
      width: 120px;
      height: 120px;
      max-width: 100%;
      margin: 0 auto 20px;
      border-radius: 27px; /* iPhone app-icon corner shape at this size */
      box-shadow: 0 6px 20px rgba(36, 37, 34, 0.12);
    }
    h1 {
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 32px;
      line-height: 1.2;
      margin: 0 0 10px;
    }
    .lead { color: var(--muted); margin: 0 0 28px; }
    .button {
      display: block;
      padding: 15px 20px;
      border-radius: 28px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .primary { background: var(--sage); color: #FFFFFF; }
    .secondary { background: var(--card); color: var(--ink); border: 1px solid var(--border); }
    .button:focus-visible { outline: 3px solid var(--sage); outline-offset: 3px; }
    .note { color: var(--muted); font-size: 14px; margin: 20px 0 0; }
    footer { margin-top: 36px; font-size: 13px; color: var(--muted); }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img class="app-icon" src="app-icon.png" width="120" height="120" alt="The Un-Journal app icon">
    <h1>The Un-Journal</h1>
    <p class="lead">A few honest minutes are enough.<br>Write what's on your mind. Let it go.</p>

    <a class="button primary" href="https://apps.apple.com/app/id6785877239">Download on the App Store</a>
    <a class="button secondary" href="unjournal://">Already have the app? Open it</a>

    <p class="note">For iPhone. What you write stays on your paper. The app never sees it.</p>

    <footer>
      <a href="https://terms.alignedlifeapps.com/">Terms</a> ·
      <a href="https://privacypolicy.alignedlifeapps.com/">Privacy</a> ·
      contact@alignedlifeapps.com
    </footer>
  </main>
</body>
</html>
